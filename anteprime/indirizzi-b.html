<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Anteprima B · Controlla gli indirizzi · GiroFacile</title>
<link rel="stylesheet" href="../static/design-system/theme.css">
<link rel="stylesheet" href="../static/design-system/components.css">
<link rel="stylesheet" href="../static/design-system/layout.css">
<script src="../static/design-system/shell.js" defer></script>
<script src="indirizzi-demo.js" defer></script>
</head>
<!-- Variante B · Elenco e dettaglio.
     A sinistra l'elenco degli indirizzi da sistemare con il motivo; a destra uno alla volta,
     con mappa sempre aperta e spillo già sulla proposta. Risolto un indirizzo si passa da soli
     al successivo. -->
<body data-gf-surface="workspace" data-gf-layout="base" data-gf-nav-active="ordini"
      data-gf-title="Ordini" data-gf-subtitle="Gestisci gli ordini ricevuti e prepara le tue consegne."
      data-gf-user-name="Supermercati Iorio" data-gf-user-role="admin">
<main data-gf-shell-content>
  <div data-gf-slot="header-actions" class="gf-cluster">
    <nav class="gf-cluster" aria-label="Versioni da confrontare"><a class="gf-button" data-variant="ghost" data-size="sm" href="indirizzi-a.html">A</a><a class="gf-button" data-variant="secondary" data-size="sm" href="indirizzi-b.html" aria-current="page">B</a><a class="gf-button" data-variant="ghost" data-size="sm" href="indirizzi-c.html">C</a></nav>
  </div>
  <section class="gf-panel"><div class="gf-panel__body"><p class="gf-muted">Elenco ordini · 15 ordini selezionati per la pianificazione.</p></div></section>

  <dialog class="gf-modal" data-size="lg" data-demo-dialog aria-labelledby="demoTitle">
    <div data-gf-modal-content>
      <header class="gf-modal__header">
        <div>
          <p class="gf-kicker">Prima di pianificare</p>
          <h2 class="gf-modal__title" id="demoTitle">Controlla gli indirizzi</h2>
          <p class="gf-muted" data-demo-message role="status"></p>
        </div>
        <button type="button" class="gf-icon-button" data-demo-action="close" aria-label="Chiudi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg></button>
      </header>

      <div class="gf-modal__body gf-stack">
        <div class="gf-stack" data-gap="sm">
          <div class="gf-progress">
            <div class="gf-progress__top"><span><b data-demo-done-count></b> risolti</span><span data-demo-left-count></span></div>
            <div class="gf-progress__track" role="img" aria-label="Indirizzi risolti"><span class="gf-progress__done" data-demo-progress data-gf-width="0"></span></div>
          </div>
          <div class="gf-cluster" data-demo-bulk><button type="button" class="gf-button" data-variant="secondary" data-size="sm" data-demo-action="accept-safe">Accetta le <span data-demo-safe-count></span> proposte nel comune giusto</button></div>
        </div>

        <div class="gf-grid" data-cols="side-main">
          <nav aria-label="Indirizzi da sistemare">
            <ul class="gf-list" data-demo-list="item"></ul>
          </nav>
          <div class="gf-stack">
            <div data-demo-list="row"></div>
            <div class="gf-empty" data-demo-empty hidden><strong>Tutti gli indirizzi sono sistemati</strong><p class="gf-muted">Puoi continuare alla pianificazione.</p></div>
          </div>
        </div>
      </div>

      <footer class="gf-modal__footer">
        <button type="button" class="gf-button" data-variant="secondary" data-demo-action="close">Chiudi</button>
        <button type="button" class="gf-button" data-variant="primary" data-demo-continue data-demo-action="continue">Continua alla pianificazione</button>
      </footer>
    </div>
  </dialog>

  <template data-demo-template="item">
    <li><button type="button" class="gf-list-item" data-demo-item data-demo-action="select" data-demo-id>
      <span class="gf-list-item__main"><strong data-demo-field="name"></strong><small data-demo-field="number"></small></span>
      <span class="gf-badge" data-demo-tone data-dot data-demo-field="reason"></span>
    </button></li>
  </template>

  <template data-demo-template="row">
    <section class="gf-stack" data-demo-row data-demo-id hidden aria-live="polite">
      <div class="gf-cluster" data-justify="between">
        <div class="gf-stack" data-gap="sm">
          <p class="gf-kicker" data-demo-field="number"></p>
          <h3 class="gf-subtitle" data-demo-field="name"></h3>
        </div>
        <span class="gf-badge" data-demo-tone data-dot data-demo-field="reason"></span>
      </div>
      <dl class="gf-details" data-layout="rows">
        <div class="gf-details__item"><dt>Scritto</dt><dd data-demo-field="written"></dd></div>
        <div class="gf-details__item" data-demo-if="found"><dt>Trovato da Google</dt><dd><strong data-demo-field="found"></strong></dd></div>
      </dl>
      <p class="gf-muted" data-demo-field="hint"></p>
      <div class="gf-cluster" data-demo-if="safe">
        <button type="button" class="gf-button" data-variant="primary" data-demo-action="use" data-demo-id>Usa questo indirizzo</button>
      </div>
      <form class="gf-stack" data-gap="sm" data-demo-verify data-demo-id>
        <label class="gf-field"><span class="gf-field__label">Correggi l'indirizzo</span><input class="gf-input" data-demo-input data-demo-id data-demo-value="written" maxlength="500"></label>
        <p class="gf-field__error" data-demo-note data-demo-id hidden></p>
        <div class="gf-cluster"><button type="submit" class="gf-button" data-variant="secondary" data-size="sm">Verifica</button></div>
      </form>
      <div class="gf-route-panel__canvas" data-map data-demo-map data-demo-id role="region" aria-label="Scegli la posizione della consegna"></div>
      <p class="gf-muted">Lo spillo è sulla posizione proposta: trascinalo sul punto giusto per forzarla.</p>
      <div class="gf-cluster" data-justify="between">
        <button type="button" class="gf-button" data-variant="secondary" data-size="sm" data-demo-action="pin" data-demo-id>Forza la posizione dello spillo</button>
        <button type="button" class="gf-button" data-variant="ghost" data-size="sm" data-demo-action="exclude" data-demo-id>Escludi dalla pianificazione</button>
      </div>
    </section>
  </template>
</main>
</body>
</html>
