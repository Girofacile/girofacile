<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Anteprima C · Controlla gli indirizzi · GiroFacile</title>
<link rel="stylesheet" href="../static/design-system/theme.css">
<link rel="stylesheet" href="../static/design-system/components.css">
<link rel="stylesheet" href="../static/design-system/layout.css">
<script src="../static/design-system/shell.js" defer></script>
<script src="indirizzi-demo.js" defer></script>
</head>
<!-- Variante C · Tabella compatta.
     Una riga per indirizzo: scritto, proposta di Google, motivo e azioni brevi («Usa», «Modifica»,
     «Escludi»). «Modifica» apre sotto la riga il campo e la mappa. Pensata per molti indirizzi
     da sistemare in poco spazio. -->
<body data-gf-surface="workspace" data-gf-layout="base" data-gf-nav-active="ordini"
      data-gf-title="Ordini" data-gf-subtitle="Gestisci gli ordini ricevuti e prepara le tue consegne."
      data-gf-user-name="Supermercati Iorio" data-gf-user-role="admin">
<main data-gf-shell-content>
  <div data-gf-slot="header-actions" class="gf-cluster">
    <nav class="gf-cluster" aria-label="Versioni da confrontare"><a class="gf-button" data-variant="ghost" data-size="sm" href="indirizzi-a.html">A</a><a class="gf-button" data-variant="ghost" data-size="sm" href="indirizzi-b.html">B</a><a class="gf-button" data-variant="secondary" data-size="sm" href="indirizzi-c.html" aria-current="page">C</a></nav>
  </div>
  <section class="gf-panel"><div class="gf-panel__body"><p class="gf-muted">Elenco ordini · 15 ordini selezionati per la pianificazione.</p></div></section>

  <dialog class="gf-modal" data-size="lg" data-demo-dialog aria-labelledby="demoTitle">
    <div data-gf-modal-content>
      <header class="gf-modal__header">
        <div>
          <p class="gf-kicker">Prima di pianificare</p>
          <h2 class="gf-modal__title" id="demoTitle">Controlla gli indirizzi</h2>
          <p class="gf-muted" data-demo-message role="status"></p>
        </div>
        <button type="button" class="gf-icon-button" data-demo-action="close" aria-label="Chiudi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg></button>
      </header>

      <div class="gf-modal__body gf-stack">
        <div class="gf-stack" data-gap="sm">
          <div class="gf-progress">
            <div class="gf-progress__top"><span><b data-demo-done-count></b> risolti</span><span data-demo-left-count></span></div>
            <div class="gf-progress__track" role="img" aria-label="Indirizzi risolti"><span class="gf-progress__done" data-demo-progress data-gf-width="0"></span></div>
          </div>
          <div class="gf-cluster" data-demo-bulk><button type="button" class="gf-button" data-variant="primary" data-size="sm" data-demo-action="accept-safe">Usa le <span data-demo-safe-count></span> proposte sicure</button></div>
        </div>

        <div class="gf-table-wrap">
          <table class="gf-table" data-gf-responsive="cards" aria-label="Indirizzi da sistemare">
            <thead><tr><th scope="col">Cliente</th><th scope="col">Scritto</th><th scope="col">Proposta di Google</th><th scope="col">Motivo</th><th scope="col">Azioni</th></tr></thead>
            <tbody data-demo-list="row">
              <template data-demo-template="row">
                <tr data-demo-row data-demo-id>
                  <td data-label="Cliente"><strong data-demo-field="name"></strong><br><small class="gf-muted" data-demo-field="number"></small></td>
                  <td data-label="Scritto" data-demo-field="written"></td>
                  <td data-label="Proposta di Google"><strong data-demo-if="found" data-demo-field="found"></strong><span class="gf-muted" data-demo-if="!found">Nessuna proposta</span></td>
                  <td data-label="Motivo"><span class="gf-badge" data-demo-tone data-dot data-demo-field="reason"></span></td>
                  <td data-label="Azioni"><div class="gf-cluster">
                    <button type="button" class="gf-button" data-variant="primary" data-size="sm" data-demo-if="safe" data-demo-action="use" data-demo-id>Usa</button>
                    <button type="button" class="gf-button" data-variant="secondary" data-size="sm" data-demo-action="edit" data-demo-id>Modifica</button>
                    <button type="button" class="gf-button" data-variant="ghost" data-size="sm" data-demo-action="exclude" data-demo-id>Escludi</button>
                  </div></td>
                </tr>
                <tr data-demo-edit hidden>
                  <td colspan="5">
                    <div class="gf-grid" data-cols="2">
                      <form class="gf-stack" data-gap="sm" data-demo-verify data-demo-id>
                        <p class="gf-muted" data-demo-field="hint"></p>
                        <label class="gf-field"><span class="gf-field__label">Correggi l'indirizzo</span><input class="gf-input" data-demo-input data-demo-id data-demo-value="written" maxlength="500"></label>
                        <p class="gf-field__error" data-demo-note data-demo-id hidden></p>
                        <div class="gf-cluster">
                          <button type="submit" class="gf-button" data-variant="secondary" data-size="sm">Verifica</button>
                          <button type="button" class="gf-button" data-variant="ghost" data-size="sm" data-demo-action="pin" data-demo-id>Forza la posizione dello spillo</button>
                        </div>
                      </form>
                      <div class="gf-route-panel__canvas" data-map data-demo-map data-demo-id role="region" aria-label="Scegli la posizione della consegna"></div>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <section class="gf-stack" data-gap="sm" data-demo-done-section hidden>
          <h3 class="gf-subtitle">Risolti</h3>
          <ul class="gf-list" data-demo-list="done"></ul>
        </section>
      </div>

      <footer class="gf-modal__footer">
        <button type="button" class="gf-button" data-variant="secondary" data-demo-action="close">Chiudi</button>
        <button type="button" class="gf-button" data-variant="primary" data-demo-continue data-demo-action="continue">Continua alla pianificazione</button>
      </footer>
    </div>
  </dialog>
</main>
</body>
</html>
