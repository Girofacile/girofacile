<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Anteprima B · Notifiche · GiroFacile</title>
<link rel="stylesheet" href="../static/design-system/theme.css">
<link rel="stylesheet" href="../static/design-system/components.css">
<link rel="stylesheet" href="../static/design-system/layout.css">
<script src="../static/design-system/shell.js" defer></script>
<script src="../static/design-system/design-system.js" defer></script>
</head>
<!-- Variante B: pannello alto quanto lo schermo che entra da destra: filtri in alto (Tutte, Da leggere, Giri, Ordini, Messaggi), notifiche più grandi raggruppate per giorno con l'azione a destra. -->
<body data-gf-layout="base" data-gf-surface="workspace" data-gf-nav-active="dashboard" data-gf-title="Dashboard"
      data-gf-subtitle="Panoramica della giornata." data-gf-user-name="SUPERMERCATI IORIO" data-gf-user-role="admin">
<main data-gf-shell-content class="gf-stack" data-gap="lg">
  <nav class="gf-cluster" aria-label="Varianti da confrontare"><a href="notifiche-a.html">A · Tendina ordinata</a> · <strong>B · Pannello laterale</strong> · <a href="notifiche-c.html">C · Finestra centrale</a></nav>
  <div class="gf-cluster" data-justify="between">
    <p class="gf-muted">Clicca la campanella per aprire le notifiche.</p>
    <div class="gf-notifications">
      <button type="button" class="gf-icon-button" aria-label="Notifiche" aria-expanded="false" onclick="toggleNotifications()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="gf-icon-button__dot" aria-hidden="true">3</span></button>
      
    </div>
  </div>
  <section class="gf-panel"><header class="gf-panel__header"><h2 class="gf-panel__title">Giri di oggi</h2></header>
    <div class="gf-list"><div class="gf-list-item"><span class="gf-list-item__main"><strong>08:00 · Marco Esposito</strong><small>Iveco Daily 35 · 6 fermate</small></span></div>
    <div class="gf-list-item"><span class="gf-list-item__main"><strong>08:30 · Alessandro Paglietta</strong><small>Fiat Ducato · 9 fermate</small></span></div></div>
  </section>
  <div id="notifOverlay" class="gf-overlay" data-position="side" hidden onclick="if(event.target===this)toggleNotifications(false)"><div class="gf-modal" role="dialog" aria-modal="true" aria-labelledby="notifTitle" id="notifPanel"></div></div>

<script>
// Solo per l'anteprima: notifiche d'esempio, nessuna chiamata al server.
const ICONS = {route_started:['M8 5v14l11-7z','1'], route_completed:['M5 12l4 4 10-10','3'], delivery_missed:['M12 9v4 M12 17h.01 M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z','5'],
  order_new:['M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10','2'], chat:['M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z','4']};
const KIND = {route_started:'Giri', route_completed:'Giri', delivery_missed:'Giri', order_new:'Ordini', chat:'Messaggi'};
const NOTES = [
  {id:1, type:'delivery_missed', title:'Consegna mancata', text:'Bar Roma (Portici): cliente assente. Giro di Marco Esposito.', time:'10:42', day:'Oggi', unread:true, action:'Apri giro'},
  {id:2, type:'chat', title:'Nuovo messaggio', text:'Marco Esposito: «Sono davanti al cancello, nessuno risponde».', time:'10:39', day:'Oggi', unread:true, action:'Rispondi'},
  {id:3, type:'route_started', title:'Giro avviato', text:'Il giro di Alessandro Paglietta · Nocera Inferiore è partito.', time:'08:31', day:'Oggi', unread:true, action:'Apri controllo'},
  {id:4, type:'order_new', title:'4 nuovi ordini', text:'Arrivati da Shopify: pronti da pianificare.', time:'07:55', day:'Oggi', unread:false, action:'Vedi ordini'},
  {id:5, type:'route_completed', title:'Giro completato', text:'Il giro di Marco Esposito · Cava de’ Tirreni è stato completato. 12 consegnate, 1 mancata.', time:'17:20', day:'Ieri', unread:false, action:'Vedi resoconto'},
  {id:6, type:'route_started', title:'Giro avviato', text:'Il giro di Alessandro Paglietta · Salerno è partito.', time:'08:05', day:'Ieri', unread:false, action:'Apri controllo'}
];
let filter = 'all';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = n => `<span class="gf-stat-strip__icon" data-tone="${ICONS[n.type][1]}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${ICONS[n.type][0]}"/></svg></span>`;
function visible(){ return NOTES.filter(n => filter === 'all' || (filter === 'unread' ? n.unread : KIND[n.type] === filter)); }
function grouped(render, dayWrap = day => `<p class="gf-kicker">${day}</p>`){
  const days = [...new Set(visible().map(n => n.day))];
  if(!days.length) return '<div class="gf-empty"><p>Nessuna notifica in questa vista.</p></div>';
  return days.map(day => `${dayWrap(day)}${render(visible().filter(n => n.day === day))}`).join('');
}
function read(id){ const n = NOTES.find(x => x.id === id); if(n) n.unread = false; draw(); }
function readAll(){ NOTES.forEach(n => n.unread = false); draw(); }
function setFilter(value){ filter = value; draw(); }
function filters(){
  const options = [['all','Tutte'],['unread','Da leggere'],['Giri','Giri'],['Ordini','Ordini'],['Messaggi','Messaggi']];
  return `<div class="gf-segmented" role="group" aria-label="Filtra le notifiche">${options.map(([v,l]) =>
    `<button type="button" aria-pressed="${filter===v}" onclick="setFilter('${v}')">${l}</button>`).join('')}</div>`;
}
function unreadLabel(){ const c = NOTES.filter(n => n.unread).length; return c ? `${c} da leggere` : 'Tutto letto'; }

// B: pannello laterale a tutta altezza con filtri; azione principale a destra di ogni notifica.
function toggleNotifications(open){ const p = document.getElementById('notifOverlay'); p.hidden = open === undefined ? !p.hidden : !open; }
function draw(){
  document.getElementById('notifPanel').innerHTML = `
    <header class="gf-modal__header"><div><p class="gf-kicker">${unreadLabel()}</p><h2 class="gf-modal__title" id="notifTitle">Notifiche</h2></div><button type="button" class="gf-icon-button" aria-label="Chiudi" onclick="toggleNotifications(false)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg></button></header>
    <div class="gf-modal__body gf-stack" data-gap="lg">${filters()}
      ${grouped(list => `<div class="gf-list">${list.map(n => `
        <div class="gf-list-item"${n.unread ? ' aria-current="true"' : ''}>${icon(n)}
          <span class="gf-list-item__main"><strong>${esc(n.title)}</strong><small>${esc(n.text)}</small><small>${n.day} alle ${n.time}</small></span>
          <span class="gf-stack" data-gap="sm"><button type="button" class="gf-button" data-variant="secondary" data-size="sm">${n.action}</button>
          ${n.unread ? `<button type="button" class="gf-button" data-variant="ghost" data-size="sm" onclick="read(${n.id})">Segna letta</button>` : ''}</span>
        </div>`).join('')}</div>`)}</div>
    <footer class="gf-modal__footer"><button type="button" class="gf-button" data-variant="secondary" onclick="readAll()">Segna tutte lette</button></footer>`;
}
toggleNotifications(true);

draw();
</script>
</main>
</body>
</html>
