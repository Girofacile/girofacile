<!DOCTYPE html>
<html lang="it">
<head>
<link rel="icon" href="/favicon.ico?v=8968" sizes="any">
<link rel="shortcut icon" href="/favicon.ico?v=8968">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=8968">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=8968">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=8968">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=8967">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GiroFacile · Setup Account Autista</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.card{background:#fff;border-radius:20px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.2);}
.brand{text-align:center;margin-bottom:28px;}
.brand-icon{width:60px;height:60px;background:#2563eb;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;margin:0 auto 14px;}
.brand h1{font-size:22px;font-weight:800;color:#111827;}
.brand-sub{font-size:13px;color:#6b7280;margin-top:4px;}
.driver-welcome{background:#eff6ff;border-radius:10px;padding:14px 16px;margin-bottom:24px;text-align:center;}
.driver-welcome strong{font-size:15px;color:#1d4ed8;display:block;margin-bottom:2px;}
.driver-welcome span{font-size:13px;color:#6b7280;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:5px;}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:15px;background:#f9fafb;color:#111827;outline:none;}
.form-group input:focus{border-color:#2563eb;background:#fff;}
.hint{font-size:11px;color:#9ca3af;margin-top:4px;}
.btn{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
.btn:hover{background:#1d4ed8;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.error{color:#ef4444;font-size:13px;text-align:center;margin-top:10px;}
.loading{text-align:center;color:#6b7280;font-size:14px;margin-top:20px;}
.success{text-align:center;padding:20px 0;}
.success-icon{font-size:48px;margin-bottom:12px;}
.success h2{font-size:20px;font-weight:800;margin-bottom:6px;}
.success p{font-size:14px;color:#6b7280;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon">G</div>
    <h1>GiroFacile</h1>
    <div class="brand-sub">Portale autista</div>
  </div>

  <div id="loadingState" class="loading">Caricamento...</div>

  <div id="errorState" style="display:none;text-align:center;padding:20px 0;">
    <div style="font-size:40px;margin-bottom:12px">⚠️</div>
    <h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Link non valido</h2>
    <p id="errorText" style="font-size:13px;color:#6b7280"></p>
  </div>

  <div id="setupForm" style="display:none">
    <div class="driver-welcome">
      <strong id="driverName">Benvenuto!</strong>
      <span id="driverEmail"></span>
    </div>
    <p style="font-size:14px;color:#6b7280;margin-bottom:20px;text-align:center">Scegli una password per accedere al tuo portale autista</p>
    <div class="form-group">
      <label>Nuova password</label>
      <input id="password" type="password" placeholder="Minimo 6 caratteri">
      <div class="hint">Almeno 6 caratteri</div>
    </div>
    <div class="form-group">
      <label>Conferma password</label>
      <input id="passwordConfirm" type="password" placeholder="Ripeti la password">
    </div>
    <button class="btn" id="setupBtn" onclick="submitSetup()">Accedi al portale →</button>
    <div class="error" id="setupError"></div>
  </div>

  <div id="successState" style="display:none">
    <div class="success">
      <div class="success-icon">✅</div>
      <h2>Account attivato!</h2>
      <p>Stai per essere reindirizzato al portale...</p>
    </div>
  </div>
</div>

<script>
const token = location.pathname.split('/driver/setup/')[1] || '';

async function api(url, opts={}) {
  const r = await fetch(url, {headers:{'Content-Type':'application/json'},...opts});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail || 'Errore');
  return d;
}

async function init() {
  try {
    const info = await api(`/api/driver/setup/${token}`);
    document.getElementById('driverName').textContent = info.driver_name;
    document.getElementById('driverEmail').textContent = info.email;
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('setupForm').style.display = 'block';
  } catch(e) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display = 'block';
    document.getElementById('errorText').textContent = e.message;
  }
}

async function submitSetup() {
  const pw = document.getElementById('password').value;
  const pw2 = document.getElementById('passwordConfirm').value;
  const err = document.getElementById('setupError');
  err.textContent = '';
  if(pw.length < 6) { err.textContent = 'La password deve essere di almeno 6 caratteri'; return; }
  if(pw !== pw2) { err.textContent = 'Le password non coincidono'; return; }
  const btn = document.getElementById('setupBtn');
  btn.disabled = true;
  btn.textContent = 'Attivazione...';
  try {
    await api(`/api/driver/setup/${token}`, {method:'POST', body:JSON.stringify({password:pw})});
    document.getElementById('setupForm').style.display = 'none';
    document.getElementById('successState').style.display = 'block';
    setTimeout(() => location.href = '/driver', 1500);
  } catch(e) {
    err.textContent = e.message;
    btn.disabled = false;
    btn.textContent = 'Accedi al portale →';
  }
}

init();
</script>
</body>
</html>
