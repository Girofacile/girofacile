<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>La tua consegna · GiroFacile</title>
  <link rel="stylesheet" href="/static/tracking/style.css?v=20261004_design">
  <script src="/static/tracking/app.js?v=20261004_design" defer></script>

<link rel="stylesheet" href="/static/design-system/theme.css?v=gf_ztl_20261025">
<link rel="stylesheet" href="/static/design-system/components.css?v=gf_mapfix_20261020b">
<link rel="stylesheet" href="/static/design-system/layout.css?v=gf_audit_20261020">
<link rel="stylesheet" href="/static/design-system/portals.css?v=ds_20261007">
<script src="/static/design-system/design-system.js?v=ds_20261007" defer></script>
<script src="/static/design-system/gf-icons.js?v=gf_unified_20261014_1"></script>
<link rel="stylesheet" href="/static/design-system/portal-unified.css?v=gf_unified_20261014_1">
</head>
<body data-gf-surface="tracking" data-gf-portal>
  <main>
    <header><svg class="gf-unified-brand-mark" viewBox="0 0 34 34" role="img" aria-label="Logo GiroFacile"><rect width="34" height="34" rx="9" fill="#1F5BFF"/><path d="M24 12.2A8.2 8.2 0 1 0 25 17.5H17.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.2" cy="9.6" r="2.4" fill="#9CC0FF"/></svg><strong>GiroFacile</strong><span class="eyebrow">Tracking consegna</span></header>
    <section class="card" aria-labelledby="title">
      <div class="parcel" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/></svg></div>
      <p class="eyebrow">Un aggiornamento per te</p>
      <h1 id="title">La tua consegna</h1>
      <p id="message" role="status" aria-live="polite">Stiamo recuperando gli aggiornamenti…</p>
      <div id="details" hidden>
        <p id="status" class="badge"></p>
        <dl>
          <div><dt>Data prevista</dt><dd id="date"></dd></div>
          <div class="arrival"><dt id="etaLabel">Arrivo previsto</dt><dd><span id="eta"></span><span id="etaDate" class="eta-date"></span></dd></div>
        </dl>
        <p id="stops" class="stops" hidden></p>
        <p id="completed" hidden></p>
        <p id="updated" class="muted"></p>
        <p id="estimateNote" class="muted">L’orario è una stima e può variare durante il giro.</p>
      </div>
      <button id="refresh" type="button">Aggiorna</button>
      <noscript>Attiva JavaScript per visualizzare lo stato aggiornato della consegna.</noscript>
    </section>
    <footer><strong>La tua consegna, in un unico posto.</strong><br>Solo le informazioni che ti servono. Nessun account necessario.</footer>
  </main>
</body>
</html>
