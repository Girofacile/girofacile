<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=8967"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Setup agente · GiroFacile</title><style>body{margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;min-height:100dvh;display:grid;place-items:center;padding:18px}.card{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 16px 45px rgba(15,23,42,.1);padding:24px}h1{margin:0 0 8px}p{color:#6b7280;line-height:1.5}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:800;text-transform:uppercase;color:#475569}.field input{border:1px solid #d1d5db;border-radius:12px;padding:12px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:900;background:#2563eb;color:#fff;cursor:pointer;margin-top:10px}.muted{font-size:13px;color:#6b7280}.error{color:#b91c1c}.ok{color:#166534}</style></head><body><div class="card"><h1>Portale Agente</h1><p id="info">Verifica link...</p><form id="setupForm" style="display:none" onsubmit="completeSetup(event)"><div class="field"><label>Nuova password</label><input id="password" type="password" required minlength="6"></div><div class="field"><label>Conferma password</label><input id="password2" type="password" required minlength="6"></div><button class="btn" type="submit">Imposta password e accedi</button></form><p class="muted">Il link è personale e valido 7 giorni.</p></div><script>const token=location.pathname.split('/').pop();async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},credentials:'include',...opt});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.detail||'Errore');return d}async function init(){try{const d=await api('/api/agent/setup/'+token);info.innerHTML=`Ciao <strong>${d.agent_name}</strong>, imposta la password per accedere al portale agente${d.company_name?` di <strong>${d.company_name}</strong>`:''}.`;setupForm.style.display='block'}catch(e){info.className='error';info.textContent=e.message}}async function completeSetup(e){e.preventDefault();const p=password.value.trim();if(p!==password2.value.trim()){alert('Le password non coincidono');return}try{await api('/api/agent/setup/'+token,{method:'POST',body:JSON.stringify({password:p})});location.href='/agent'}catch(err){alert(err.message)}}init();</script></body></html>
