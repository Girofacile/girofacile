<!DOCTYPE html>
<html lang="it">
<head>
<link rel="icon" href="/favicon.ico?v=8968" sizes="any">
<link rel="shortcut icon" href="/favicon.ico?v=8968">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=8968">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=8968">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=8968">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=8967">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiroFacile · Super Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#273549;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#3b82f6;--danger:#ef4444;--success:#10b981}
body{min-height:100vh;background:radial-gradient(circle at top left,rgba(59,130,246,.22),transparent 34%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:430px;background:rgba(30,41,59,.96);border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:0 24px 90px rgba(0,0,0,.35)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900}.brand h1{font-size:20px}.brand p{font-size:12px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
.notice{padding:13px 14px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:14px;color:#bfdbfe;font-size:13px;line-height:1.45;margin-bottom:20px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 7px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
button{width:100%;margin-top:18px;padding:13px 16px;border-radius:12px;border:0;background:var(--accent);color:white;font-weight:800;font-size:15px;cursor:pointer}button:hover{background:#2563eb}button:disabled{opacity:.65;cursor:not-allowed}.msg{margin-top:14px;font-size:13px;line-height:1.45}.msg.error{color:#fecaca}.msg.ok{color:#bbf7d0}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:13px}.links a{color:var(--muted);text-decoration:none}.links a:hover{color:var(--text)}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">GF</div>
      <div><h1>Super Admin</h1><p>Pannello SaaS GiroFacile</p></div>
    </div>
    <div class="notice">Accesso riservato al proprietario della piattaforma. Per aziende, autisti e agenti usa il login normale.</div>
    <form id="superadmin-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" placeholder="admin" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit-btn" type="submit">Accedi al pannello SaaS</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="links">
      <a href="/login">Login utenti GiroFacile</a>
      <a href="/">Torna al sito</a>
    </div>
  </main>
<script>
const form=document.getElementById('superadmin-form');
const msg=document.getElementById('msg');
const btn=document.getElementById('submit-btn');
form.addEventListener('submit',async(e)=>{
  e.preventDefault(); msg.textContent=''; msg.className='msg'; btn.disabled=true;
  try{
    const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail||'Accesso non riuscito');
    msg.textContent='Accesso effettuato. Reindirizzamento...'; msg.className='msg ok';
    window.location.href=data.redirect_url||'/admin';
  }catch(err){msg.textContent=err.message||'Errore'; msg.className='msg error';}
  finally{btn.disabled=false;}
});
</script>
</body>
</html>
