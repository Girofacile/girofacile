<!DOCTYPE html>
<html lang="it">
<head>
<link rel="icon" href="/favicon.ico?v=8968" sizes="any">
<link rel="shortcut icon" href="/favicon.ico?v=8968">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=8968">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=8968">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=8968">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=8967">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiroFacile · Super Admin</title>

<link rel="stylesheet" href="/static/design-system/theme.css?v=gf_base_20261015v">
<link rel="stylesheet" href="/static/design-system/components.css?v=gf_mapfix_20261020b">
<link rel="stylesheet" href="/static/design-system/layout.css?v=gf_audit_20261020">
<script src="/static/design-system/design-system.js?v=ds_20261007" defer></script>
</head>
<body data-gf-surface="auth">
  <main class="gf-auth__main">
    <div class="gf-auth__card">
      <div class="gf-cluster"><img src="/static/girofacile-logo.png" alt="Logo GiroFacile" width="40" height="40"><div><strong>GiroFacile</strong><p class="gf-kicker">Pannello Super Admin</p></div></div>
      <h1 class="gf-title">Accesso Super Admin</h1>
      <div class="gf-alert" data-status="info">Accesso riservato al proprietario della piattaforma. Per aziende, autisti e agenti usa il login normale.</div>
      <form id="superadmin-form" class="gf-stack">
        <label class="gf-field" for="username"><span class="gf-field__label">Username</span><input class="gf-input" id="username" name="username" autocomplete="username" placeholder="admin" required></label>
        <label class="gf-field" for="password"><span class="gf-field__label">Password</span><input class="gf-input" id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="submit-btn" class="gf-button" data-variant="primary" type="submit">Accedi al pannello SaaS</button>
        <div id="msg" role="status" aria-live="polite"></div>
      </form>
      <div class="gf-cluster" data-justify="between">
        <a class="gf-button" data-variant="link" href="/login">Login utenti GiroFacile</a>
        <a class="gf-button" data-variant="link" href="/">Torna al sito</a>
      </div>
    </div>
  </main>
<script>
const form=document.getElementById('superadmin-form');
const msg=document.getElementById('msg');
const btn=document.getElementById('submit-btn');
form.addEventListener('submit',async(e)=>{
  e.preventDefault(); msg.textContent=''; msg.className=''; btn.disabled=true;
  try{
    const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.detail||'Accesso non riuscito');
    msg.textContent='Accesso effettuato. Reindirizzamento...'; msg.className='gf-alert'; msg.dataset.status='success';
    window.location.href=data.redirect_url||'/admin';
  }catch(err){msg.textContent=err.message||'Errore'; msg.className='gf-alert'; msg.dataset.status='danger';}
  finally{btn.disabled=false;}
});
</script>
</body>
</html>
