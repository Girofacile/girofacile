name: Tests and container
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      ALLOW_SQLITE_LEGACY: 'true'
      TEST_POSTGRES_URL: postgresql://test_runner:test_only_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q -ra
      - run: node --test tests/*.cjs
      - name: Verify electric mobility responsive interfaces
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python tests/check_electric_responsive.py
      - name: Preserve electric mobility responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electric-mobility-responsive
          path: test-results/electric-responsive/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify customer tracking responsive interfaces
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 leaflet@1.9.4
          node tests/check_tracking_responsive.js
          node tests/check_gps_responsive.js
      - name: Preserve customer tracking screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-tracking-responsive
          path: |
            test-results/tracking-browser/
            test-results/gps-browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify management pages and interactions
        run: |
          pip install pillow
          GF_DESIGN_PREVIEW=1 python tests/check_design_system.py
          python tests/check_management_design.py after
      - name: Preserve management screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-responsive
          path: |
            test-results/management-design/
            test-results/design-system/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify collaborator presets and responsive permissions
        run: GF_COLLABORATORS_PREVIEW=1 python tests/check_collaborators_ui.py
      - name: Preserve collaborator responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaborators-responsive
          path: test-results/collaborators-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate OSRM infrastructure and synthetic dataset
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/osrm_prepare_unix.sh
          bash -n scripts/osrm_healthcheck.sh
          printf 'POSTGRES_PASSWORD=compose-validation-only\n' > .env
          docker compose config --quiet
          OSRM_IMAGE=$(docker compose config --format json | python -c 'import json,sys; print(json.load(sys.stdin)["services"]["osrm"]["image"])')
          export OSRM_IMAGE
          python tests/create_osrm_smoke_fixture.py data/osrm/synthetic.osm.pbf
          bash scripts/osrm_prepare_unix.sh data/osrm/synthetic.osm.pbf synthetic-ci
          trap 'docker rm -f girofacile-osrm-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name girofacile-osrm-ci \
            -v "$PWD/data/osrm:/data:ro" \
            -v "$PWD/scripts/osrm_healthcheck.sh:/opt/girofacile-healthcheck.sh:ro" \
            --health-cmd 'timeout 5 bash /opt/girofacile-healthcheck.sh' \
            --health-interval 2s --health-timeout 6s --health-retries 5 \
            "$OSRM_IMAGE" osrm-routed --algorithm mld /data/synthetic-ci.osrm
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' girofacile-osrm-ci)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs girofacile-osrm-ci; exit 1; fi
            sleep 2
          done
          test "$status" = healthy
      - run: docker build -t girofacile-test .
      - name: Verify backup tools in the deployable image
        run: docker run --rm --entrypoint sh girofacile-test -c 'test -f /app/scripts/backup_database.py && pg_dump --version && pg_restore --version'
