<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Brico';font-weight:700;src:url(data:font/woff2;base64,__FONT700__) format('woff2');}
html,body{margin:0;background:#0B1430;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// GIROFACILE · "IL GIRO DI DOMANI" — 9:16, every pixel is a pure function of t.
const W=1080,H=1920,CX=540,CY=760,DUR=15,BEAT=0.5;
const C={b:'#0060FD',o:'#FF6A2B',p:'#DBE6FF',k:'#0B1430',w:'#FFFFFF'};
const main=document.getElementById('c').getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const X=off.getContext('2d');
const LOGO=new Image();LOGO.src='data:image/png;base64,__LOGO__';

const cl=x=>x<0?0:x>1?1:x, seg=(t,a,b)=>cl((t-a)/(b-a)), N10=1-Math.pow(2,-10);
const eo=x=>{x=cl(x);return (1-Math.pow(2,-10*x))/N10;};
const ei=x=>{x=cl(x);return x<=0?0:(Math.pow(2,10*x-10)-Math.pow(2,-10))/N10;};
const eio=x=>{x=cl(x);return x<.5?ei(2*x)/2:1-ei(2-2*x)/2;};
const spr=(s,w=17)=>s<=0?0:Math.min(1,1-(1+w*s)*Math.exp(-w*s));
const lerp=(a,b,u)=>a+(b-a)*u;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,u)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],u))).join(',')})`;};
const F=s=>`700 ${s}px Brico`;
const CAP=0.70;

function rect(x,y,w,h,col){X.fillStyle=col;X.fillRect(x,y,w,h);}
function rrect(x,y,w,h,r,col){X.fillStyle=col;X.beginPath();X.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));X.fill();}
function disc(x,y,r,col){if(r<=0)return;X.fillStyle=col;X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fill();}
function tile(x,y,s,rot,icon=1){ // GiroFacile logo tile; icon scales inside the blue tile
  X.save();X.translate(x,y);X.rotate(rot);X.beginPath();X.roundRect(-s/2,-s/2,s,s,s*0.22);X.clip();
  X.fillStyle=C.b;X.fillRect(-s/2,-s/2,s,s);
  if(icon>0){const k=s*icon;X.drawImage(LOGO,-k/2,-k/2,k,k);}
  X.restore();
}
function layout(word,fs,track=-0.035,oW=null){
  X.font=F(fs);let xs=[],x=0;
  for(const ch of word){const w=(ch==='O'&&oW)?oW:X.measureText(ch).width;xs.push({ch,x,w});x+=w+track*fs;}
  const tot=x-track*fs;xs.forEach(l=>l.x+=-tot/2);return xs;
}

// ================= BAR 1 · HOOK (0–2): logo tile -> road -> 5 lanes -> DOMANI =================
const T0=220;
function stripe(t,i){
  const u=eio(seg(t,1.0+i*0.02,1.4+i*0.02));
  const y=lerp(CY+(i-2)*T0/5,CY+(i-2)*384,u); let h=lerp(T0/5,330,u);
  h=lerp(h,392,eio(seg(t,1.84,1.98)));return [y,h];
}
const W1=[['DOMANI',2.0,250],['12',2.5,470],['CONSEGNE',3.0,190],['GIRO',3.5,300]];
function bar1(t){
  rect(0,0,W,H,C.k);
  if(t<0.5){tile(CX,CY,T0,Math.PI/2*spr(t-0.02));return;}
  if(t<1.0){const u=eio(seg(t,0.5,0.86));const w=lerp(T0,1120,u);
    rrect(CX-w/2,CY-T0/2,w,T0,T0*0.22*(1-u),C.b);
    const ic=1-eio(seg(t,0.5,0.7)); if(ic>0){X.save();X.translate(CX,CY);X.rotate(Math.PI/2);X.drawImage(LOGO,-T0*ic/2,-T0*ic/2,T0*ic,T0*ic);X.restore();}
    return;}
  const fs=W1[0][2],L=layout('DOMANI',fs);
  for(let i=0;i<5;i++){
    const [y,h]=stripe(t,i);rect(-10,y-h/2,W+20,h+0.5,C.b);
    if(t>1.45){X.save();X.beginPath();X.rect(0,y-h/2,W,h);X.clip();
      const dx=(i%2?1:-1)*(1-eo(seg(t,1.5+i*0.035,1.93)))*1200;
      X.font=F(fs);X.fillStyle=C.w;L.forEach(l=>X.fillText(l.ch,CX+l.x+dx,CY+CAP*fs/2));X.restore();}
  }
}

// ================= BAR 2 · KINETIC TYPE (2–4) =================
function oM(fs){X.font=F(fs);return {oW:X.measureText('O').width,R:CAP*fs/2*1.05,th:0.17*fs};}
function bar2(t){
  rect(0,0,W,H,C.b);
  const band=520;
  const clipOn=()=>{X.save();X.beginPath();X.rect(0,CY-band/2,W,band);X.clip();};
  clipOn();
  W1.forEach(([w,t0,fs],j)=>{
    const M=oM(fs), L=layout(w,fs,-0.035,w==='GIRO'?M.oW:null);
    const tn=j<W1.length-1?W1[j+1][1]:99;
    L.forEach((l,k)=>{
      const pin=j===0?1:eio(seg(t,t0+k*0.03-0.04,t0+k*0.03+0.24));
      const pout=eio(seg(t,tn+k*0.03-0.04,tn+k*0.03+0.24));
      if(pin<=0||pout>=1)return;
      const y=(1-pin)*band-pout*band; let x=CX+l.x;
      if(w==='GIRO'){
        const fly=eio(seg(t,3.78,4.08));
        if(l.ch!=='O')x-=fly*(1300+k*120);
        if(l.ch==='O'){
          X.restore();
          const cx=x+l.w/2,cy=CY+y,g=eio(seg(t,3.8,4.12));
          const ro=lerp(M.R,2200,g),ri=lerp(M.R-M.th,170,g),px=lerp(cx,CX,g),py=lerp(cy,CY,g);
          disc(px,py,ro,C.w);disc(px,py,ri,C.b);
          clipOn();return;
        }
      }
      X.font=F(fs);X.fillStyle=C.w;X.fillText(l.ch,x,CY+CAP*fs/2+y);
    });
  });
  X.restore();
}

// ================= BAR 3 · SHAPE MORPH (4–6): stop -> pin -> arrow -> star -> square =================
const NS=200;
function polyVerts(n,R,rot,inner=null){const v=[];const m=inner?n*2:n;for(let i=0;i<m;i++){const a=rot-Math.PI/2+i*Math.PI*2/m;const r=inner&&i%2?inner:R;v.push([Math.cos(a)*r,Math.sin(a)*r]);}return v;}
function pinVerts(){const v=[],cy=-60,r=165;for(let i=0;i<=40;i++){const a=Math.PI*(0.75+1.5*i/40);v.push([Math.cos(a)*r,cy+Math.sin(a)*r]);}v.push([0,250]);return v;}
function arrowVerts(){return [[0,-250],[210,170],[0,90],[-210,170]];}
function radial(v){
  const out=new Float32Array(NS);
  for(let s=0;s<NS;s++){const a=s/NS*Math.PI*2,dx=Math.cos(a),dy=Math.sin(a);let best=1e9;
    for(let i=0;i<v.length;i++){const p=v[i],q=v[(i+1)%v.length];const ex=q[0]-p[0],ey=q[1]-p[1];
      const den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)continue;const tt=(p[0]*ey-p[1]*ex)/den,uu=(p[0]*dy-p[1]*dx)/den;
      if(tt>0&&uu>=-1e-6&&uu<=1+1e-6&&tt<best)best=tt;}
    out[s]=best<1e8?best:(s?out[s-1]:0);}
  return out;
}
const SIDE=311;
const SHAPES=[
  {t:4.0,r:radial(polyVerts(200,170,0)),c:C.b},
  {t:4.5,r:radial(pinVerts()),c:C.o},
  {t:5.0,r:radial(arrowVerts()),c:C.k},
  {t:5.5,r:radial(polyVerts(8,250,0,140)),c:C.b},
  {t:5.84,r:radial(polyVerts(4,SIDE/Math.SQRT2,Math.PI/4)),c:C.b},
];
function shapeAt(t){
  let k=0;for(let i=0;i<SHAPES.length;i++)if(t>=SHAPES[i].t)k=i;
  const A=SHAPES[Math.max(0,k-1)],B=SHAPES[k],d=k===4?0.15:0.3,u=k===0?1:eio(seg(t,B.t,B.t+d));
  const r=new Float32Array(NS);for(let s=0;s<NS;s++)r[s]=lerp(A.r[s],B.r[s],u);
  let rot=0;[2,3].forEach(i=>rot+=Math.PI*eo(seg(t,SHAPES[i].t,SHAPES[i].t+0.4)));
  return {r,c:k===0?B.c:mix(A.c,B.c,u),rot};
}
function drawRadial(r,rot,sc,cx,cy){X.beginPath();for(let s=0;s<NS;s++){const a=s/NS*Math.PI*2+rot;const x=cx+Math.cos(a)*r[s]*sc,y=cy+Math.sin(a)*r[s]*sc;s?X.lineTo(x,y):X.moveTo(x,y);}X.closePath();}
function bar3(t){
  rect(0,0,W,H,C.w);
  const S=shapeAt(t);
  if(t<5.8){const E=shapeAt(Math.max(4,t-0.09));X.strokeStyle='rgba(11,20,48,0.25)';X.lineWidth=3;drawRadial(E.r,E.rot,1.3,CX,CY);X.stroke();}
  X.fillStyle=S.c;drawRadial(S.r,S.rot,1,CX,CY);X.fill();
}

// ================= BAR 4 + 5 · 2D→3D → DATA (6–10): one block -> 3 routes -> km chart =================
const KM=[22.5,13.4,18.4], VAL1=KM.map(v=>v/22.5), VAL0=VAL1;
const NAMES=['Marco','Luca','Sara'], HMAX=470;
function cam(t){
  let p=lerp(0,56,eio(seg(t,6.0,6.5))),y=lerp(0,-38,eio(seg(t,6.0,6.5)));
  y=lerp(y,-22,eio(seg(t,6.5,7.5)));
  const f=eio(seg(t,7.5,8.0));p=lerp(p,90,f);y=lerp(y,0,f);
  return {p:p*Math.PI/180,y:y*Math.PI/180,oy:lerp(0,240,f)};
}
function proj(c,x,y,z){
  const x1=x*Math.cos(c.y)-y*Math.sin(c.y),y1=x*Math.sin(c.y)+y*Math.cos(c.y);
  const y2=-y1*Math.cos(c.p)-z*Math.sin(c.p),z2=y1*Math.sin(c.p)-z*Math.cos(c.p);
  const k=2600/(2600+z2);return [CX+x1*k,CY+c.oy+y2*k,z2];
}
function boxes(t){
  const sl=eio(seg(t,6.5,7.0)),ext=eio(seg(t,6.0,6.5)),B=[];
  for(let i=0;i<3;i++){
    const w0=SIDE/3,x0=-SIDE/2+w0*(i+0.5);
    const w=lerp(w0+1.5,210,sl),x=lerp(x0,(i-1)*290,sl),d=lerp(SIDE,150,sl);
    let h=SIDE*ext;h=lerp(h,VAL0[i]*HMAX,eio(seg(t,7.0+i*0.05,7.32+i*0.05)));
    h=lerp(h,VAL1[i]*HMAX,eio(seg(t,8.5+i*0.05,8.8+i*0.05)));
    h=lerp(h,0,eio(seg(t,9.5+i*0.04,9.78+i*0.04)));
    B.push({x,w,d,h});
  }
  return B;
}
function drawBoxes(c,B){
  const faces=[];
  B.forEach(b=>{
    const x0=b.x-b.w/2,x1=b.x+b.w/2,y0=-b.d/2,y1=b.d/2,z0=0,z1=Math.max(b.h,0.01);
    [[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],C.b],
     [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],C.k],
     [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1],C.o],
     [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],C.o]].forEach(f=>{
      const pts=f.slice(0,4).map(q=>proj(c,...q));let a=0;for(let i=0;i<4;i++){const p=pts[i],q=pts[(i+1)%4];a+=p[0]*q[1]-q[0]*p[1];}
      if(Math.abs(a)<2)return;faces.push({pts,col:f[4],z:pts.reduce((s,p)=>s+p[2],0)/4});});
  });
  faces.sort((a,b)=>b.z-a.z);
  faces.forEach(f=>{X.fillStyle=f.col;X.beginPath();f.pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath();X.fill();});
}
const fmt=v=>v.toFixed(1).replace('.',',');
function bar45(t){
  rect(0,0,W,H,C.w);
  const c=cam(t),B=boxes(t);
  if(t<6.02){rrect(CX-SIDE/2,CY-SIDE/2,SIDE,SIDE,0,C.b);return;}
  drawBoxes(c,B);
  if(t>=8.0){
    const base=proj(c,0,-75,0)[1],bw=eio(seg(t,8.0,8.3))*880;
    rect(CX-bw/2,base,bw,5,C.k);
    X.textAlign='center';
    B.forEach((b,i)=>{
      const s=eo(seg(t,8.05+i*0.05,8.35+i*0.05))*(1-eio(seg(t,9.42,9.58)));if(s<=0)return;
      const top=proj(c,b.x,-75,b.h);X.save();X.translate(top[0],top[1]-28);X.scale(1,s);
      X.font=F(52);X.fillStyle=C.k;X.fillText(fmt(b.h/HMAX*22.5)+' km',0,0);X.restore();
      const s2=eo(seg(t,8.5+i*0.05,8.8+i*0.05))*(1-eio(seg(t,9.42,9.58)));if(s2<=0)return;X.save();X.translate(b.x*1.0+CX,base+62);X.scale(1,s2);X.font=F(40);X.fillStyle=C.k;X.globalAlpha=0.6;X.fillText(NAMES[i],0,0);X.restore();
    });
    X.textAlign='left';X.globalAlpha=1;
    const draw=eio(seg(t,9.0,9.38));
    if(draw>0){
      const P=[[-430,0],...VAL1.map((v,i)=>[(i-1)*290,v*HMAX]),[430,0]].map(q=>proj(c,q[0],-75,q[1]));
      X.strokeStyle=C.o;X.lineWidth=10;X.lineJoin='round';X.lineCap='round';X.beginPath();
      const n=(P.length-1)*draw;P.forEach((p,i)=>{if(i>Math.ceil(n))return;const q=i<=n?p:[lerp(P[i-1][0],p[0],n-(i-1)),lerp(P[i-1][1],p[1],n-(i-1))];i?X.lineTo(q[0],q[1]):X.moveTo(q[0],q[1]);});X.stroke();
      P.slice(1,4).forEach((p,i)=>disc(p[0],p[1],18*eo(seg(t,9.05+i*0.07,9.25+i*0.07)),C.o));
    }
    if(t>9.5){const u=eo(seg(t,9.5,9.95));X.font=F(170);X.fillStyle=C.k;X.textAlign='center';
      X.save();X.beginPath();X.rect(0,280,W,200);X.clip();X.fillText(fmt(54.3*u)+' km',CX,440+(1-eo(seg(t,9.5,9.75)))*200);X.restore();X.textAlign='left';}
  }
}

// ================= BAR 6 · UI (10–12): the result becomes the app =================
function bar6(t){
  rect(0,0,W,H,C.w);
  const c=cam(9.999),base0=proj(c,0,-75,0)[1];
  const P0=[[-430,0],...VAL1.map((v,i)=>[(i-1)*290,v*HMAX]),[430,0]].map(q=>proj(c,q[0],-75,q[1]));
  const g=eio(seg(t,10.0,10.4)),col=eio(seg(t,11.72,11.98));
  const cw=lerp(1000,900,g),ch=lerp(760,640,g),cy0=lerp(CY,CY-120,g);
  const kx=CX+250,ky=CY+380,tgOn=eio(seg(t,11.0,11.22)),knobX=lerp(kx-52,kx+52,tgOn);
  X.save();X.translate(knobX,ky);X.scale(lerp(1,1e-4,col),lerp(1,1e-4,col));X.translate(-knobX,-ky);
  rrect(CX-cw/2,cy0-ch/2,cw,ch,lerp(0,48,g),mix(C.w,C.k,g));
  const mapP=p=>[CX+(p[0]-CX)*lerp(1,0.85,g),lerp(p[1],cy0+200+(p[1]-base0)*0.42,g)];
  const P=P0.map(mapP),bl=mapP([CX,base0]);
  X.fillStyle=mix(C.k,'#33405f',g);X.fillRect(CX-cw*0.4,bl[1],cw*0.8,5);
  X.strokeStyle=C.o;X.lineWidth=10;X.lineJoin='round';X.lineCap='round';X.beginPath();P.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();
  P.slice(1,4).forEach(p=>disc(p[0],p[1],18,C.o));
  X.font=F(lerp(170,130,g));X.fillStyle=mix(C.k,C.w,g);X.textAlign=g<0.5?'center':'left';
  X.fillText('54,3 km',g<0.5?CX:CX-cw/2+64,lerp(440,cy0-ch/2+250,g));X.textAlign='left';
  X.font=F(36);X.fillStyle=`rgba(255,255,255,${g*0.6})`;X.fillText('KM TOTALI DI DOMANI',CX-cw/2+68,cy0-ch/2+92);
  const lab=eo(seg(t,11.25,11.5));if(lab>0){X.save();X.beginPath();X.rect(0,cy0+ch/2-110,W,80);X.clip();
    X.font=F(44);X.fillStyle=C.p;X.fillText('3 giri · 12 consegne',CX-cw/2+68,cy0+ch/2-52+(1-lab)*70);X.restore();}
  // toggle "Più mezzi" grows out of the last stop
  const tg=eio(seg(t,10.5,10.82));
  if(tg>0){const last=P[3],pw=lerp(0,220,tg),ph=lerp(36,116,tg);
    rrect(kx-pw/2,ky-ph/2,pw,ph,ph/2,mix('#C9D3E6',C.b,tgOn));
    disc(lerp(last[0],knobX,tg),lerp(last[1],ky,tg),lerp(18,44,tg),tg<1?mix(C.o,C.w,tg):C.w);
    X.font=F(56);X.fillStyle=C.k;X.globalAlpha=eo(seg(t,10.7,10.9));X.textAlign='right';X.fillText('Più mezzi',kx-150,ky+20);X.textAlign='left';X.globalAlpha=1;}
  X.restore();
  const ca=eio(seg(t,10.7,10.98)),cp=seg(t,11.0,11.12),co=eio(seg(t,11.3,11.55));
  if(ca>0&&co<1){const rx=lerp(kx+300,kx+10,ca)+co*360,ry=lerp(ky+360,ky+8,ca)+co*300,rr=30*(1-0.25*Math.sin(cp*Math.PI));
    X.strokeStyle=C.k;X.lineWidth=7;X.beginPath();X.arc(rx,ry,rr,0,Math.PI*2);X.stroke();}
  if(col>0){const m=eio(seg(t,11.75,12.0));disc(lerp(knobX,CX,m),lerp(ky,CY,m),lerp(44,70,m),mix(C.w,C.b,m));}
}

// ================= BAR 7 · STRONGEST (12–14) =================
const SL=[{t:12.0,w:'DOMANI',bg:C.o,fg:C.k,fs:230},{t:12.5,w:'È GIÀ',bg:C.b,fg:C.w,fs:280},{t:13.0,w:'PRONTO.',bg:C.w,fg:C.b,fs:205}];
function irisC(i){
  if(i===0)return [CX,CY];
  const s=SL[i-1],L=layout(s.w,s.fs),ch=i===1?'O':'G',l=L.find(q=>q.ch===ch)||L[0];
  return [CX+l.x+l.w/2,CY];
}
function slam(t,s){
  const L=layout(s.w,s.fs);X.font=F(s.fs);
  L.forEach((l,k)=>{const u=eo(seg(t,s.t+0.04+k*0.025,s.t+0.3+k*0.025));if(u<=0)return;
    const sc=lerp(2.4,1,u);X.save();X.translate(CX+l.x+l.w/2,CY);X.scale(sc,sc);X.fillStyle=s.fg;X.globalAlpha=Math.min(1,u*3);
    X.fillText(l.ch,-l.w/2,CAP*s.fs/2);X.restore();});
  X.globalAlpha=1;
}
function bar7(t){
  rect(0,0,W,H,C.w);
  for(let i=0;i<SL.length;i++){const s=SL[i];if(t<s.t)break;
    const [ix,iy]=irisC(i);disc(ix,iy,lerp(i===0?70:0,2400,eo(seg(t,s.t,s.t+0.24))),s.bg);
    if(i===0&&t<12.06)disc(CX,CY,70,C.b);
    const n=SL[i+1];if(!n||t<n.t+0.24)slam(t,s);}
  if(t>=13.5){
    const L=layout('PRONTO.',205),o=L.filter(q=>q.ch==='O')[1];
    disc(CX+o.x+o.w/2,CY,lerp(0,2400,eo(seg(t,13.5,13.72))),C.k);
    const cols=[C.b,C.o,C.p],m=eio(seg(t,13.78,14.0));
    cols.forEach((cc,i)=>{const e=eo(seg(t,13.56+i*0.05,13.8+i*0.05));if(e<=0)return;
      const x0=lerp(-1120,0,e),w=lerp(1080,400,m),xs=lerp(x0,CX-200,m),h=lerp(90,400/3,m),y=lerp(CY-135+i*90,CY-200+i*400/3,m);
      rect(xs,y,w,h+0.5,mix(cc,C.b,m));});
  }
}

// ================= END TITLE (14–15) =================
function end(t){
  rect(0,0,W,H,C.k);

window.renderAudio=async function(){

  const rn=A.createBufferSource();rn.buffer=nb;rn.loop=true;const rf=A.createBiquadFilter();rf.type='bandpass';rf.Q.value=2;rf.frequency.setValueAtTime(250,10);rf.frequency.exponentialRampToValueAtTime(7000,11.98);
  const rg=A.createGain();rg.gain.setValueAtTime(0.001,10);rg.gain.exponentialRampToValueAtTime(0.5,11.97);rg.gain.linearRampToValueAtTime(0.0001,12.0);rn.connect(rf).connect(rg).connect(comp);rn.start(10);rn.stop(12.02);
  const ro=A.createOscillator(),rog=A.createGain(),rlp=A.createBiquadFilter();ro.type='sawtooth';ro.frequency.setValueAtTime(110,10);ro.frequency.exponentialRampToValueAtTime(880,11.98);
  rog.gain.setValueAtTime(0.0001,10);rog.gain.exponentialRampToValueAtTime(0.12,11.97);rog.gain.linearRampToValueAtTime(0.0001,12.0);rlp.type='lowpass';rlp.frequency.value=3000;ro.connect(rlp).connect(rog).connect(comp);ro.start(10);ro.stop(12.02);
  const buf=await A.startRendering();
  let pk=0;for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)pk=Math.max(pk,Math.abs(d[i]));}
  const g=0.89/pk,n=buf.length,dv=new DataView(new ArrayBuffer(44+n*4));const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
