services:
  osrm:
    # Same immutable official image is used by both preparation scripts.
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b}
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/${OSRM_DATASET_BASENAME:-sud-latest}.osrm"]
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data:ro
      - ./scripts/osrm_healthcheck.sh:/opt/girofacile-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "timeout", "5", "bash", "/opt/girofacile-healthcheck.sh"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 60s

  # Development-only S3-compatible storage for POD signatures, photos and PDFs.
  # It is never started by the normal production stack unless the local-storage
  # profile is explicitly selected.
  minio:
    profiles: ["local-storage"]
    image: minio/minio:latest
    container_name: girofacile-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_LOCAL_USER:-girofacile-local}
      MINIO_ROOT_PASSWORD: ${MINIO_LOCAL_PASSWORD:-girofacile-local-dev-only}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    profiles: ["local-storage"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_LOCAL_USER:-girofacile-local}
      MINIO_ROOT_PASSWORD: ${MINIO_LOCAL_PASSWORD:-girofacile-local-dev-only}
      MINIO_BUCKET: ${MINIO_LOCAL_BUCKET:-girofacile-pod-local}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "Bucket MinIO locale pronto: $$MINIO_BUCKET"

  postgres:
    image: postgres:16
    container_name: girofacile-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-girofacile}
      POSTGRES_USER: ${POSTGRES_USER:-girofacile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-girofacile} -d ${POSTGRES_DB:-girofacile}"]
      interval: 10s
      timeout: 5s
      retries: 10

  girofacile:
    build: .
    container_name: girofacile-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Host Python uses localhost; containers use service DNS. DB overrides still win.
      OSRM_URL: http://osrm:5000
      GIROFACILE_RUNTIME: docker-compose
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-girofacile}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-girofacile}"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups

volumes:
  postgres_data:
  minio_data:
