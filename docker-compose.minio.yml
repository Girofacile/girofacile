services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: girofacile-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_LOCAL_USER:-girofacile-local}
      MINIO_ROOT_PASSWORD: ${MINIO_LOCAL_PASSWORD:-girofacile-local-dev-only}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_LOCAL_USER:-girofacile-local}
      MINIO_ROOT_PASSWORD: ${MINIO_LOCAL_PASSWORD:-girofacile-local-dev-only}
      MINIO_BUCKET: ${MINIO_LOCAL_BUCKET:-girofacile-pod-local}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        echo "Bucket MinIO locale pronto: $$MINIO_BUCKET"

volumes:
  minio_data:
